<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Music Kiosk: a Christmas tree with a gold music note in front -->
  <rect width="64" height="64" rx="14" fill="#0f2a1f"/>
  <!-- snow -->
  <circle cx="9" cy="12" r="1.6" fill="#fff" opacity=".8"/>
  <circle cx="54" cy="9" r="1.3" fill="#fff" opacity=".7"/>
  <circle cx="57" cy="30" r="1.4" fill="#fff" opacity=".6"/>
  <circle cx="7" cy="40" r="1.2" fill="#fff" opacity=".6"/>
  <!-- trunk -->
  <rect x="25" y="51" width="7" height="7" rx="1.5" fill="#7a4a2a"/>
  <!-- tree tiers -->
  <path d="M28.5 10 L42 30 H15 Z" fill="#2f9e57"/>
  <path d="M28.5 19 L46 41 H11 Z" fill="#268a4b"/>
  <path d="M28.5 29 L50 53 H7 Z" fill="#1f7a40"/>
  <!-- garland -->
  <path d="M17 38 Q28 43 40 36" stroke="#f6d27a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- ornaments -->
  <circle cx="22" cy="31" r="2.6" fill="#e0435a"/>
  <circle cx="33" cy="24" r="2.3" fill="#f6d27a"/>
  <circle cx="15" cy="48" r="2.6" fill="#f6d27a"/>
  <circle cx="27" cy="46" r="2.6" fill="#e0435a"/>
  <!-- star -->
  <path d="M28.5 2.5 L30.6 7.3 L35.8 7.6 L31.8 10.9 L33.1 16 L28.5 13.2 L23.9 16 L25.2 10.9 L21.2 7.6 L26.4 7.3 Z" fill="#ffd34d" stroke="#fff3c4" stroke-width=".6"/>
  <!-- music note (beamed eighths): dark outline layer, then gold on top -->
  <g fill="#0f2a1f" stroke="#0f2a1f" stroke-width="3" stroke-linejoin="round">
    <path d="M40 29 L59 24.5 V32.5 L40 37 Z"/>
    <rect x="40" y="29" width="3.6" height="23"/>
    <rect x="55.4" y="25" width="3.6" height="23"/>
    <ellipse cx="37.2" cy="52.8" rx="6" ry="4.6" transform="rotate(-20 37.2 52.8)"/>
    <ellipse cx="52.6" cy="48.6" rx="6" ry="4.6" transform="rotate(-20 52.6 48.6)"/>
  </g>
  <g fill="#ffd34d">
    <path d="M40 29 L59 24.5 V32.5 L40 37 Z"/>
    <rect x="40" y="29" width="3.6" height="23"/>
    <rect x="55.4" y="25" width="3.6" height="23"/>
    <ellipse cx="37.2" cy="52.8" rx="6" ry="4.6" transform="rotate(-20 37.2 52.8)"/>
    <ellipse cx="52.6" cy="48.6" rx="6" ry="4.6" transform="rotate(-20 52.6 48.6)"/>
  </g>
</svg>
